name: Build lean-infoview-proxy

# Attaches `lean-infoview-proxy-<arch>-<os>.{tar.gz,zip}` to the GitHub release of the tag.
# The extension (src/lean4.rs, download_proxy) downloads these assets by name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: x86_64-linux, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: aarch64-linux, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: x86_64-macos, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: aarch64-macos, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: x86_64-windows, archive: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: aarch64-windows, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        if: "!contains(matrix.target, 'x86_64-apple')"
        run: cargo test -p lean-infoview-proxy --target ${{ matrix.target }}

      - name: Build
        run: cargo build -p lean-infoview-proxy --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf lean-infoview-proxy-${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release lean-infoview-proxy

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/lean-infoview-proxy.exe -DestinationPath lean-infoview-proxy-${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lean-infoview-proxy-${{ matrix.asset }}
          path: lean-infoview-proxy-${{ matrix.asset }}.${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
